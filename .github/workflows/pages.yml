name: Deploy StrangerCam to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configure Firebase web app when project variables exist
        if: ${{ vars.FIREBASE_API_KEY != '' && vars.FIREBASE_PROJECT_ID != '' && vars.FIREBASE_APP_ID != '' }}
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          node -e 'const fs = require("node:fs"); const config = {apiKey: process.env.FIREBASE_API_KEY, authDomain: process.env.FIREBASE_AUTH_DOMAIN, projectId: process.env.FIREBASE_PROJECT_ID, appId: process.env.FIREBASE_APP_ID, storageBucket: process.env.FIREBASE_STORAGE_BUCKET, messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID}; fs.writeFileSync("firebase-config.js", `window.__firebase_config = ${JSON.stringify(config)};\n`);'
      - name: Install backend test dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: Test verified-email authorization
        run: npm --prefix functions run test:unit
      - name: Test Firestore rules in emulator
        run: npx --yes firebase-tools@14 emulators:exec --project strangercam-rules-test --only firestore "npm --prefix functions run test:rules"
      - name: Validate page
        run: python scripts/smoke_test.py --require-node
      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp firebase-config.js _site/firebase-config.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
